{{ define "main" }}

<section class="panel">
  <h1 class="h3 panel-title">{{ .Title }}</h1>
  {{ with .Content }}<div class="body-copy list-intro">{{ . }}</div>{{ end }}

  <div class="prompt-line list-prompt" aria-hidden="true"><span class="muted">$</span> ls {{ .Title | urlize }}</div>
  {{ with .Pages }}
  <ul class="ls">
    {{ range . }}
    <li><span class="ls-mode" aria-hidden="true">{{ if .IsNode }}drwxr-xr-x{{ else }}-rw-r--r--{{ end }}</span><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
    {{ end }}
  </ul>
  {{ end }}
</section>

{{ end }}
