<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode | default "en" }}" data-mode="amber">
<head>
  {{ partial "head.html" . }}
</head>
<body>

  <div class="scanlines-overlay"></div>
  <div class="noise-layer" data-noise></div>
  <div class="noise-layer" data-noise></div>
  <div class="noise-layer" data-noise></div>
  <div class="noise-layer" data-noise></div>

  {{ partial "header.html" . }}

  <div class="content-wrap">
    <div class="wrap">
      {{ block "main" . }}{{ end }}
    </div>
  </div>

  {{ partial "footer.html" . }}

  {{- $js := resources.Get "js/theme.js" }}
  {{- if hugo.IsProduction }}{{ $js = $js | minify }}{{ end }}
  {{- $js = $js | fingerprint }}
  <script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}"></script>
</body>
</html>
