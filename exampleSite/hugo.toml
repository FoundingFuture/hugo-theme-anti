baseURL = "https://example.com/"
locale = "en-US"
title = "anti"
theme = "hugo-theme-anti"

[params]
  shortName = "anti"
  logoText = "!anti"
  tagline = "anti — a systems language, compiled by antic"
  subtitle = "C-rooted syntax, plus struct types that carry their own functions"
  description = "anti is a small, C-rooted systems language compiled by antic."
  footerText = "© 2026 anti-lang — built with Hugo + hugo-theme-anti"

# A theme cannot set markup, so the site writes this line itself.
# Without it Chroma writes inline colours that ignore the phosphor mode.
[markup.highlight]
  noClasses = false
